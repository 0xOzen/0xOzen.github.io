<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,"><title>AequAI · Monthly review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{color-scheme:dark;--bg:#000;--tx:#f2f2f3;--tx2:#aaa;--tx3:#828282;--line:rgb(255 255 255 / .16);--gk-a:#ff8a3d;--sans:Geist,Archivo,Urbanist,"Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);overflow:hidden}
.app{display:flex;height:100%}
.map{position:relative;flex:1;min-width:0}
svg{width:100%;height:100%;display:block}
.mesh{opacity:.035}
.pill{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:rgb(24 24 24 / .92);color:var(--tx);font:14px var(--sans);cursor:pointer;text-decoration:none}
.pill:hover{border-color:var(--tx)}
.pill:focus-visible,.node:focus-visible{outline:2px solid var(--gk-a);outline-offset:3px}
.back{left:24px;top:22px}
.history{position:absolute;right:24px;top:22px;z-index:4}
.history .pill{position:static}
#historyList{position:absolute;right:0;top:48px;margin:0;padding:6px;list-style:none;background:#111;border:1px solid var(--line);min-width:220px;max-height:320px;overflow:auto}
#historyList button{width:100%;text-align:left;background:none;border:0;color:var(--tx2);font:13px var(--sans);padding:9px 10px;min-height:36px;cursor:pointer}
#historyList button:hover,#historyList [aria-current=true]{color:var(--tx)}
.panel-toggle{right:24px;bottom:20px}
.foot{position:absolute;left:24px;bottom:18px;margin:0;font:11px/1.6 var(--mono);color:var(--tx3);max-width:50%}
.panel{width:320px;flex:none;border-left:1px solid var(--line);padding:28px 24px;overflow:auto;background:#050505}
.app.no-panel .panel{display:none}
.kicker{font:11px var(--mono);letter-spacing:.1em;color:var(--gk-a);margin:22px 0 8px;text-transform:uppercase}
.kicker:first-child{margin-top:0}
.panel h1{font-size:28px;line-height:1.08;font-weight:500;letter-spacing:-.035em;margin:0 0 12px}
.desc{color:var(--tx2);font-size:14px;line-height:1.6;margin:0}
.desc.small{font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.actions .pill{position:static;font-size:13px}
.actions .primary{background:var(--tx);color:#000;border-color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:34px;border:1px solid var(--line);background:none;color:var(--tx);font:12px var(--sans);padding:4px 12px;border-radius:17px;cursor:pointer}
.chips button:hover{border-color:var(--gk-a);color:var(--gk-a)}
.hint{font:11px/1.6 var(--mono);color:var(--tx3);margin-top:22px}
.node{cursor:pointer;outline:none}
.node text{fill:var(--tx);font-family:var(--sans);paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round}
.node .mark{fill:#1b1b1b;stroke:#f2f2f3;stroke-width:1.2}
.node.inner text{font-weight:600}
.node.dim{opacity:.22}
.node.hot .mark{stroke:var(--gk-a);fill:#2a1a10}
.node.hot text{fill:var(--gk-a)}
.link{fill:none;stroke:#fff;stroke-width:.7;opacity:.22}
.link.dim{opacity:.05}
.link.hot{stroke:var(--gk-a);opacity:.85;stroke-width:1.1}
.ring-outer{fill:none;stroke:#fff;stroke-width:1;opacity:.55}
.ring-inner{fill:none;stroke:var(--gk-a);stroke-width:1.6}
.hub-title{fill:var(--tx);font:600 20px var(--sans);text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:760px){.panel{position:absolute;inset:auto 0 0 0;width:auto;max-height:46%;border-left:0;border-top:1px solid var(--line)}.app{display:block}.map{height:100%}.foot{display:none}.panel-toggle{bottom:auto;top:70px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* v7.12: hub = the mark in mesh squares; field version */
.hub-sub{fill:var(--tx2);font:500 12px var(--mono);letter-spacing:.08em;text-anchor:middle;text-transform:uppercase;paint-order:stroke;stroke:#000;stroke-width:4px}
.field{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.with-field svg{position:relative}
.with-field .mesh{opacity:.05}

/* v19 · embedded in the homepage cover (labs #maps/cli-field, AI Control Map System items) */
.embed body,.embed{background:transparent}.embed .history,.embed .panel-toggle,.embed .foot,.embed .panel{display:none!important}
.embed .back{left:8px;top:8px;min-height:34px;font-size:13px}.light .pill{background:rgb(255 255 255 / .92)}
.embed .node text,.embed .hub-sub,.embed .hub-title{stroke:var(--bg)}
.embed .node .mark{fill:var(--bg)}
.embed .link{stroke:var(--tx)}.embed .ring-outer{stroke:var(--tx)}.embed .link.hot{stroke:var(--gk-a)}.embed .node.hot .mark{fill:#2a1a10}   /* the hot links stay amber, as in the lab */
#mesh rect{stroke:var(--tx)}
.embed .mesh,.embed .field,.embed .hub-cell{display:none}.ent{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}   /* v19b (Ali): no squares in the background — only the map and its centre mark */
.embed .field{-webkit-mask-image:radial-gradient(closest-side,#000 60%,transparent);mask-image:radial-gradient(closest-side,#000 60%,transparent)}
.compact .node text{display:none}.cap{display:none}.compact .cap{display:block;position:absolute;z-index:2;left:2px;top:0;margin:0;font:600 13px var(--sans);color:var(--gk-a)}.compact .back{display:none!important}
.light{color-scheme:light;--bg:#f4f6f5;--tx:#101412;--tx2:#5b625e;--tx3:#7c837f;--line:rgb(16 20 18 / .16)}
.light .node .mark{stroke:var(--tx)}.light .node.hot .mark{fill:#fbe3d2}
.embed .node.inner .mark{fill:var(--bg)}.embed .node.inner.hot .mark{fill:var(--bg);stroke:var(--gk-a)}.film .node.inner .mark,.film .node.inner.hot .mark{fill:transparent}   /* v20b: the page's film draws the block under the map, so the key squares stay see-through */   /* v19g (Ali): hollow key squares; the selected one fills with the 3×3 block */
.embed .node.inner.dim{opacity:1}.embed .node.inner.dim text{opacity:.3}   /* they stay solid while another key item is selected; only their names step back */
.light .hub-cell[fill="#f2f2f3"]{fill:var(--tx)}
.det-l{fill:none;stroke:var(--tx);stroke-width:1;opacity:.55}.det text{font:10.5px var(--mono);letter-spacing:.02em;fill:var(--tx2)}.det .det-st{fill:var(--tx);font-weight:500;letter-spacing:.08em}.det .amb,.det .det-v.amb{fill:var(--gk-a)}.det .det-h{font:600 13px var(--sans);letter-spacing:0;fill:var(--tx)}.det .det-k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}.det .det-v{font:12.5px var(--sans);letter-spacing:0;fill:var(--tx)}.det .det-m{font-size:10px;letter-spacing:.01em;fill:var(--tx2)}   /* v29 · the Partner studies' detail */
.light .link{opacity:.28}.light .link.hot{opacity:.85}.light .link.dim{opacity:.07}.light .ring-outer{opacity:.45}.light .mesh{opacity:.05}
</style></head>

<div class="app" id="app">
 <div class="map" id="map">
  <svg id="svg" role="img" aria-labelledby="mapTitle"><title id="mapTitle">AequAI site map</title><defs><pattern id="mesh" width="7" height="7" patternUnits="userSpaceOnUse"><rect x=".5" y=".5" width="5" height="5" fill="none" stroke="#fff" stroke-width="1"/></pattern></defs><rect class="mesh" width="100%" height="100%" fill="url(#mesh)"/><g id="links"></g><g id="rings"></g><g id="hub"></g><g id="nodes"></g></svg>
  <button class="pill back" id="back" hidden>← <span id="backLabel"></span></button>
  <div class="history"><button class="pill" id="historyBtn" aria-expanded="false" aria-controls="historyList">History <span aria-hidden="true">⌄</span></button><ol id="historyList" hidden></ol></div>
  <p class="foot" id="foot"></p>
  <button class="pill panel-toggle" id="panelToggle" aria-expanded="true">Hide panel →</button>
 </div>
 <aside class="panel" id="panel" aria-live="polite">
  <p class="kicker" id="pKicker"></p>
  <h1 id="pTitle"></h1>
  <p class="desc" id="pDesc"></p>
  <div class="actions"><a class="pill primary" id="pOpen" target="_blank" rel="noopener">Open page ↗</a><a class="pill" id="pCli" target="_blank" rel="noopener">CLI version ↗</a></div>
  <p class="kicker">Directly connected</p>
  <div class="chips" id="pInner"></div>
  <p class="kicker">Around it</p>
  <p class="desc small" id="pOuter"></p>
  <p class="hint">Select a key page on the inner ring to see its links. Select any page to put it at the centre.</p>
 </aside>
</div>
